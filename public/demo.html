/* SMART QALA — диспетчерская уличного освещения.
   Композиция: верхняя панель → полоса показателей → карта района + боковая колонка аварий и ШУО.
   Янтарный «натриевый» цвет означает горящий свет — как лампы ДНаТ на улицах. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --ink: #142030;
  --muted: #5a6779;
  --line: #d8dee7;
  --sodium: #c97a10;
  --sodium-soft: rgba(217, 138, 28, 0.16);
  --critical: #cf3337;
  --critical-soft: rgba(207, 51, 55, 0.12);
  --warning: #7d48cf;
  --warning-soft: rgba(125, 72, 207, 0.12);
  --offline: #7f8a9a;
  --focus: #2563c9;
  --map-bg: #e2e7ee;
  --street: #c3ccd8;
  --street-label: #6d7a8c;

  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;

  --radius: 10px;
  --shadow: 0 1px 2px rgba(20, 32, 48, 0.06), 0 6px 20px rgba(20, 32, 48, 0.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a111e; --surface: #111a29; --surface-2: #172234; --ink: #e4e9f1; --muted: #8e9db2;
    --line: #233149; --sodium: #f0a53a; --sodium-soft: rgba(240, 165, 58, 0.16); --critical: #ff5c61;
    --critical-soft: rgba(255, 92, 97, 0.14); --warning: #a77dff; --warning-soft: rgba(167, 125, 255, 0.15);
    --offline: #63718a; --focus: #6aa2ff; --map-bg: #0d1625; --street: #1f2d44; --street-label: #6f7f98;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a111e; --surface: #111a29; --surface-2: #172234; --ink: #e4e9f1; --muted: #8e9db2;
  --line: #233149; --sodium: #f0a53a; --sodium-soft: rgba(240, 165, 58, 0.16); --critical: #ff5c61;
  --critical-soft: rgba(255, 92, 97, 0.14); --warning: #a77dff; --warning-soft: rgba(167, 125, 255, 0.15);
  --offline: #63718a; --focus: #6aa2ff; --map-bg: #0d1625; --street: #1f2d44; --street-label: #6f7f98;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.2; }
h2 { font-size: 1.05rem; font-weight: 600; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label {
  font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600;
}

/* --- Верхняя панель --- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 1000;
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 1001;
  background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, var(--sodium) 0 30%, var(--sodium-soft) 31% 100%);
}
.brand-name { font-family: var(--font-display); font-weight: 600; font-size: 1rem; letter-spacing: 0.02em; }
.brand-sub { font-size: 0.72rem; color: var(--muted); line-height: 1.1; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 0; }
.nav a {
  padding: 6px 12px; border-radius: 999px; text-decoration: none; color: var(--muted); font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
}
.nav a:hover { color: var(--ink); background: var(--surface-2); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.nav .count {
  min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--critical); color: #fff;
  font: 600 0.72rem/20px var(--font-data); text-align: center;
}
.topbar-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.clock { font-family: var(--font-data); font-size: 0.85rem; color: var(--muted); }
.user-chip { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
.role-tag {
  font-size: 0.7rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
}
.demo-badge {
  font-size: 0.72rem; font-weight: 600; padding: 3px 10px; border-radius: 999px;
  background: var(--sodium-soft); color: var(--sodium);
}

/* --- Страница --- */
.page {
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; max-width: 1600px; margin: 0 auto;
}
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head h1 { font-family: var(--font-display); font-weight: 500; font-size: 1.35rem; }
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  min-width: 0;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
}
.panel-body { padding: 16px; }

/* --- Полоса показателей --- */
.kpis {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
}
.kpi { padding: 12px 16px; display: grid; gap: 2px; border-right: 1px solid var(--line); min-width: 0; }
.kpi:last-child { border-right: 0; }
.kpi-value { font-family: var(--font-data); font-size: 1.45rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpi-value small { font-size: 0.8rem; color: var(--muted); font-weight: 400; }
.kpi-note { font-size: 0.78rem; color: var(--muted); }
.kpi.is-lit .kpi-value { color: var(--sodium); }
.kpi.is-alarm .kpi-value { color: var(--critical); }

/* --- Главный экран --- */
.dash { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
.map-panel { position: relative; overflow: hidden; }
.map { height: min(68vh, 680px); min-height: 380px; background: var(--map-bg); }
.map-legend {
  position: absolute; left: 12px; bottom: 12px; z-index: 500;
  display: flex; gap: 12px; flex-wrap: wrap; padding: 8px 12px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--line); font-size: 0.78rem; max-width: calc(100% - 24px);
}
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.side { display: grid; gap: 16px; min-width: 0; }

/* Маркеры ШУО на карте */
.marker { position: relative; width: 22px; height: 22px; }
.marker-dot {
  position: absolute; inset: 4px; border-radius: 50%; border: 2px solid var(--surface);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
}
.marker-on .marker-dot { background: var(--sodium); box-shadow: 0 0 0 6px var(--sodium-soft), 0 0 18px var(--sodium); }
.marker-off .marker-dot { background: var(--surface); border-color: var(--offline); }
.marker-alarm .marker-dot { background: var(--critical); }
.marker-alarm::after {
  content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--critical);
  animation: pulse 1.6s ease-out infinite;
}
.marker-warning .marker-dot { background: var(--warning); }
.marker-offline .marker-dot, .marker-not_connected .marker-dot {
  background: var(--surface-2); border: 2px dashed var(--offline);
}
.marker-label {
  position: absolute; left: 24px; top: 1px; white-space: nowrap; font: 600 0.72rem var(--font-data);
  color: var(--ink); text-shadow: 0 0 3px var(--map-bg), 0 0 3px var(--map-bg), 0 0 3px var(--map-bg);
}
.map-street { stroke: var(--street); stroke-width: 10px; stroke-opacity: 1; fill: none; }
.map-rail { stroke: var(--street-label); stroke-width: 3px; stroke-dasharray: 10 6; stroke-opacity: 0.8; fill: none; }
.street-label {
  opacity: 0.6;
  background: none; border: 0; box-shadow: none; color: var(--street-label);
  font-size: 0.7rem; font-weight: 500; padding: 0;
}
.street-label::before { display: none; }
@keyframes pulse { from { transform: scale(0.7); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .marker-alarm::after { animation: none; } }

.leaflet-container { font-family: var(--font-body); background: var(--map-bg); }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--ink); }
.leaflet-bar a { background: var(--surface); color: var(--ink); border-color: var(--line); }

/* --- Статусы --- */
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px;
  font-size: 0.78rem; font-weight: 600; white-space: nowrap;
}
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill-on { color: var(--sodium); background: var(--sodium-soft); }
.pill-off { color: var(--muted); background: var(--surface-2); }
.pill-alarm, .pill-critical { color: var(--critical); background: var(--critical-soft); }
.pill-warning { color: var(--warning); background: var(--warning-soft); }
.pill-offline, .pill-not_connected { color: var(--offline); background: var(--surface-2); }
.pill-offline::before, .pill-not_connected::before { background: transparent; border: 2px dashed currentColor; width: 6px; height: 6px; }
.pill-resolved { color: var(--muted); background: var(--surface-2); }

/* --- Списки аварий и ШУО --- */
.list { list-style: none; margin: 0; padding: 0; }
.alarm {
  display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; align-items: start;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
}
.alarm:last-child { border-bottom: 0; }
.alarm-stripe { align-self: stretch; border-radius: 2px; background: var(--critical); }
.alarm-warning .alarm-stripe { background: var(--warning); }
.alarm-title { font-weight: 600; }
.alarm-meta { font-size: 0.8rem; color: var(--muted); }
.alarm-text { font-size: 0.85rem; margin-top: 2px; }
.acked { font-size: 0.75rem; color: var(--muted); }
.empty { padding: 22px 16px; color: var(--muted); text-align: center; font-size: 0.9rem; }
.empty strong { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }

.cab-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  padding: 10px 16px; border-bottom: 1px solid var(--line); text-decoration: none;
}
.cab-row:hover { background: var(--surface-2); }
.cab-row:last-child { border-bottom: 0; }
.cab-code { font-family: var(--font-data); font-weight: 600; font-size: 0.9rem; }
.cab-addr { font-size: 0.82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cab-load { font-family: var(--font-data); font-size: 0.8rem; color: var(--muted); text-align: right; }
.scroll { max-height: 360px; overflow-y: auto; }

/* --- Кнопки и формы --- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn-primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn-primary:hover { background: var(--ink); opacity: 0.88; }
.btn-danger { color: var(--critical); border-color: var(--critical); }
.btn-sm { padding: 4px 10px; font-size: 0.82rem; }
.segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 3px; background: var(--surface-2); }
.segmented button {
  border: 0; background: transparent; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; color: var(--muted);
}
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.form { display: grid; gap: 12px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: start; }
.field { display: grid; gap: 4px; font-size: 0.85rem; }
.field span { color: var(--muted); font-weight: 500; }
.field input, .field select {
  height: 40px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); min-width: 0;
}
.form-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.form-error { color: var(--critical); font-size: 0.85rem; }

/* --- Таблицы --- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th { text-align: left; font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
th, td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num { white-space: nowrap; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--surface-2); }

/* --- Карточка ШУО --- */
.cab-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.cab-title { display: grid; gap: 4px; }
.cab-title h1 { font-family: var(--font-display); font-weight: 500; font-size: 1.5rem; }
.controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.phases { display: grid; grid-template-columns: auto repeat(3, 1fr); gap: 0; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.phases > div { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: right; }
.phases > .ph-label { text-align: left; font-family: var(--font-body); color: var(--muted); font-size: 0.85rem; }
.phases > .ph-head { font-family: var(--font-body); font-weight: 600; color: var(--muted); font-size: 0.78rem; }
.phases .bad { color: var(--critical); font-weight: 600; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 14px; }
.fact { display: grid; gap: 2px; }
.fact-value { font-family: var(--font-data); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.trip-banner {
  display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  padding: 12px 16px; border-radius: var(--radius); background: var(--critical-soft); color: var(--critical); font-weight: 500;
}
.chart svg { display: block; width: 100%; height: auto; }
.chart-axis { fill: var(--muted); font: 11px var(--font-data); }
.chart-grid { stroke: var(--line); stroke-width: 1; }
.chart-line { fill: none; stroke: var(--sodium); stroke-width: 2; }
.chart-area { fill: var(--sodium-soft); stroke: none; }
.chart-end { fill: var(--sodium); }

.token-box { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.token { font-family: var(--font-data); font-size: 0.85rem; padding: 6px 10px; background: var(--surface-2); border-radius: 6px; word-break: break-all; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.85rem; }

/* --- Вход --- */
.login-wrap {
  min-height: 100%; display: grid; place-items: center;
  padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    radial-gradient(600px 300px at 50% 0%, var(--sodium-soft), transparent 70%),
    var(--bg);
}
.login { width: min(420px, 100%); display: grid; gap: 20px; }
.login-brand { display: grid; gap: 6px; text-align: center; justify-items: center; }
.login-brand .brand-mark { width: 44px; height: 44px; }
.login-brand h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; letter-spacing: 0.02em; }
.demo-roles { display: grid; gap: 8px; }
.demo-role {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; text-align: left;
  padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); cursor: pointer;
}
.demo-role:hover { border-color: var(--sodium); }
.demo-role small { grid-column: 1; color: var(--muted); font-size: 0.8rem; }

/* --- Уведомления --- */
.toasts {
  position: fixed; z-index: 2000; display: grid; gap: 8px; width: min(380px, calc(100% - 32px));
  right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}
.toast {
  padding: 12px 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--shadow); font-size: 0.88rem; display: grid; grid-template-columns: 4px 1fr; gap: 10px;
}
.toast::before { content: ""; border-radius: 2px; background: var(--muted); }
.toast-critical::before { background: var(--critical); }
.toast-ok::before { background: var(--sodium); }

@media (max-width: 1020px) {
  .dash { grid-template-columns: minmax(0, 1fr); }
  .map { height: 56vh; }
}
@media (max-width: 640px) {
  .topbar { gap: 10px; }
  .nav { order: 3; flex-basis: 100%; overflow-x: auto; flex-wrap: nowrap; }
  .clock { display: none; }
  .kpi { border-right: 0; border-bottom: 1px solid var(--line); }
}

/* Подложка OpenStreetMap в тёмной теме */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.8) contrast(0.9); }
}
:root[data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.8) contrast(0.9); }

/* --- Настройки --- */
.settings { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: start; }
.settings-nav {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px);
  display: grid; gap: 2px; padding: 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
}
.settings-nav a { padding: 7px 10px; border-radius: 6px; text-decoration: none; color: var(--muted); font-size: 0.9rem; }
.settings-nav a:hover { background: var(--surface-2); color: var(--ink); }
.settings-panels { display: grid; gap: 16px; min-width: 0; scroll-margin-top: 80px; }
.settings-panels > .panel { scroll-margin-top: 84px; }
.section-hint { font-size: 0.82rem; margin-top: 2px; }
.save-bar {
  grid-column: 1 / -1; position: sticky; bottom: 0; z-index: 900;
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
}
.hint { color: var(--muted); font-size: 0.78rem; line-height: 1.35; }
.hint-line { font-size: 0.85rem; }
.checks { display: flex; flex-wrap: wrap; gap: 10px 24px; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem; }
.check input { width: 18px; height: 18px; accent-color: var(--sodium); margin: 0; }
.kinds { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px 12px; margin: 0;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px 16px; }
.kinds legend { padding: 0 6px; color: var(--muted); font-size: 0.85rem; font-weight: 500; }
.guide { border-top: 1px solid var(--line); padding-top: 10px; font-size: 0.88rem; }
.guide summary { cursor: pointer; font-weight: 500; }
.guide ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 4px; }
.ok-text { color: var(--sodium); font-weight: 500; }
.preview { display: grid; gap: 8px; }
.preview .table-wrap { border: 1px solid var(--line); border-radius: 8px; }
.token-box input { flex: 1; min-width: 0; }
a.user-chip { text-decoration: none; padding: 4px 8px; border-radius: 8px; }
a.user-chip:hover { background: var(--surface-2); }
@media (max-width: 860px) {
  .settings { grid-template-columns: minmax(0, 1fr); }
  .settings-nav { position: static; display: flex; flex-wrap: wrap; }
}

/* --- Общие дополнения --- */
.stack { display: grid; gap: 16px; }
.title-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.section-title { font-size: 1rem; margin-top: 8px; }
.kpi.is-warn .kpi-value { color: var(--warning); }
.mode-note {
  font-size: 0.82rem; color: var(--muted); padding: 6px 10px; border-radius: 8px;
  background: var(--surface-2); max-width: 32ch;
}
.lang-switch { min-width: 52px; font-weight: 600; }
.login-lang { display: flex; justify-content: center; }
.role-hints { display: grid; gap: 2px; font-size: 0.82rem; color: var(--muted); }
.field textarea {
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  resize: vertical; min-height: 64px; font: inherit;
}
.field.inline { display: flex; align-items: center; gap: 8px; }
.field.inline input, .field.inline select { height: 36px; }
.btn-big { min-height: 48px; padding: 10px 18px; font-size: 1rem; }

/* --- Заявки --- */
.chip { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 0.78rem; font-weight: 500;
  background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip-resident { background: var(--warning-soft); color: var(--warning); }
.chip-alarm { background: var(--critical-soft); color: var(--critical); }
.pill.order-new { color: var(--critical); background: var(--critical-soft); }
.pill.order-assigned { color: var(--warning); background: var(--warning-soft); }
.pill.order-in_progress { color: var(--sodium); background: var(--sodium-soft); }
.pill.order-done, .pill.order-cancelled { color: var(--muted); background: var(--surface-2); }
.order-counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.count-tile {
  display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line);
}
.count-value { font-size: 1.4rem; font-weight: 500; }
.tile-new .count-value { color: var(--critical); }
.tile-assigned .count-value { color: var(--warning); }
.tile-in_progress .count-value { color: var(--sodium); }

.order-card { display: grid; gap: 16px; }
.order-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.order-head h1 { font-family: var(--font-display); font-weight: 500; font-size: 1.35rem; }
.order-body { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
.order-what p { margin: 6px 0 0; }
.order-who { display: grid; gap: 8px; align-content: start; }
.contact { display: grid; gap: 1px; }
.phone { font-family: var(--font-data); font-size: 1rem; }
.resolution { padding: 10px 14px; border-radius: 8px; background: var(--surface-2); }
.resolution p { margin: 4px 0 0; }
.photos { display: flex; gap: 10px; flex-wrap: wrap; }
.photo { position: relative; display: block; width: 132px; aspect-ratio: 4 / 3; max-width: 100%;
  border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-tag { position: absolute; left: 6px; bottom: 6px; font-size: 0.7rem; padding: 1px 6px; border-radius: 4px;
  background: var(--surface); color: var(--ink); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; }
.timeline li { display: grid; gap: 1px; padding: 10px 12px 0; border-top: 3px solid var(--line); font-size: 0.85rem; }
.timeline li.done { border-top-color: var(--sodium); }
.timeline-title { font-weight: 600; }
.order-actions { display: grid; gap: 14px; }
.action-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.action-row .field { flex: 1; min-width: 200px; }

.order-list { display: grid; gap: 10px; }
.order-tile {
  display: grid; gap: 4px; padding: 14px 16px; border-radius: var(--radius); background: var(--surface);
  border: 1px solid var(--line); cursor: pointer;
}
.order-tile:hover { border-color: var(--sodium); }
.order-tile-head, .order-tile-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.big-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.big-actions .btn-big { flex: 1; min-width: 160px; }

/* --- Отчёты --- */
.chart-legend { display: flex; gap: 14px; font-size: 0.8rem; color: var(--muted); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.swatch-total, .bar-total { background: var(--street); fill: var(--street); }
.swatch-waste, .bar-waste { background: var(--sodium); fill: var(--sodium); }
.hbars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: minmax(120px, 0.9fr) minmax(0, 1.6fr) 36px; gap: 10px; align-items: center; font-size: 0.88rem; }
.hbar-track { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.hbar-fill { display: block; height: 100%; background: var(--critical); border-radius: 5px; }
.hbar-value { text-align: right; }

@media (max-width: 760px) {
  .order-body { grid-template-columns: minmax(0, 1fr); }
  .hbar { grid-template-columns: minmax(0, 1fr) 36px; }
  .hbar-track { grid-column: 1 / -1; grid-row: 2; }
}

/* --- Меню администрирования --- */
.nav-more { position: relative; }
.nav-more summary {
  list-style: none; cursor: pointer; padding: 6px 12px; border-radius: 999px; color: var(--muted); font-weight: 500;
}
.nav-more summary::-webkit-details-marker { display: none; }
.nav-more summary::after { content: " ▾"; font-size: 0.8em; }
.nav-more summary:hover, .nav-more[open] summary { color: var(--ink); background: var(--surface-2); }
.nav-more.is-current summary { color: var(--ink); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.nav-menu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 1100; min-width: 210px;
  display: grid; gap: 2px; padding: 6px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
}
.nav-menu a { border-radius: 8px; }
@media (max-width: 640px) {
  .nav { overflow: visible; flex-wrap: wrap; }
  .nav-menu { left: auto; right: 0; }
}

/* Состояние шкафа по элементам: точка цвета состояния, элемент, значение */
.state-list { list-style: none; margin: 0; padding: 0; display: grid; }
.state-list li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); }
.state-list li:last-child { border-bottom: 0; }
.state-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); align-self: center; }
.state-ok .state-dot { background: #2e9d5a; }
.state-warn .state-dot { background: var(--warning); }
.state-bad .state-dot { background: var(--critical); }
.state-bad .state-value { color: var(--critical); font-weight: 600; }
.state-warn .state-value { color: var(--warning); font-weight: 600; }
.state-element { color: var(--muted); font-size: 0.92rem; }
.state-value { text-align: right; font-variant-numeric: tabular-nums; }
.order-hint { border-left: 3px solid var(--sodium); padding: 8px 12px; background: var(--surface-2, transparent); }
details.snapshot summary { cursor: pointer; color: var(--muted); }
details.snapshot pre { white-space: pre-wrap; font-family: inherit; margin: 8px 0 0; }
.lines-editor { display: grid; gap: 8px; }
.lines-editor .line-row { display: grid; grid-template-columns: 90px 1fr 1fr auto; gap: 8px; align-items: end; }
.order-state { display: grid; gap: 8px; margin-top: 4px; }

043A\u043B\u044E\u0447\u0435\u043D\u0438\u0435\u043C \u0442\u043E\u043A {current} \u0410 \u043F\u0440\u0438 \u0434\u043E\u043F\u0443\u0441\u0442\u0438\u043C\u044B\u0445 {limit} \u0410 \u2014 \u043F\u0435\u0440\u0435\u0433\u0440\u0443\u0437\u043A\u0430 \u043B\u0438\u043D\u0438\u0438":"\u0410\u0436\u044B\u0440\u0430\u0442\u044B\u043B\u0430\u0440 \u0430\u043B\u0434\u044B\u043D\u0434\u0430 \u0442\u043E\u043A {current} \u0410, \u0440\u04B1\u049B\u0441\u0430\u0442 \u0435\u0442\u0456\u043B\u0433\u0435\u043D\u0456 {limit} \u0410 \u2014 \u0436\u0435\u043B\u0456\u043D\u0456\u04A3 \u0430\u0441\u049B\u044B\u043D \u0436\u04AF\u043A\u0442\u0435\u043B\u0443\u0456","\u041F\u0435\u0440\u0435\u0434 \u043E\u0442\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u0435\u043C \u0442\u043E\u043A \u0431\u044B\u043B \u0432 \u043D\u043E\u0440\u043C\u0435 ({current} \u0410) \u2014 \u0432\u0435\u0440\u043E\u044F\u0442\u043D\u043E \u043A\u043E\u0440\u043E\u0442\u043A\u043E\u0435 \u0437\u0430\u043C\u044B\u043A\u0430\u043D\u0438\u0435 \u043D\u0430 \u043B\u0438\u043D\u0438\u0438":"\u0410\u0436\u044B\u0440\u0430\u0442\u044B\u043B\u0430\u0440 \u0430\u043B\u0434\u044B\u043D\u0434\u0430 \u0442\u043E\u043A \u049B\u0430\u043B\u044B\u043F\u0442\u044B \u0431\u043E\u043B\u0434\u044B ({current} \u0410) \u2014 \u0436\u0435\u043B\u0456\u0434\u0435 \u049B\u044B\u0441\u049B\u0430 \u0442\u04B1\u0439\u044B\u049B\u0442\u0430\u043B\u0443 \u0431\u043E\u043B\u0443\u044B \u044B\u049B\u0442\u0438\u043C\u0430\u043B","\u0421\u0432\u0435\u0442 \u0432 \u044D\u0442\u043E\u0442 \u043C\u043E\u043C\u0435\u043D\u0442 \u043D\u0435 \u0433\u043E\u0440\u0435\u043B \u2014 \u043F\u0440\u043E\u0432\u0435\u0440\u044C\u0442\u0435 \u043B\u0438\u043D\u0438\u044E \u043D\u0430 \u0437\u0430\u043C\u044B\u043A\u0430\u043D\u0438\u0435 \u043F\u0435\u0440\u0435\u0434 \u0432\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u0435\u043C":"\u0421\u043E\u043B \u0441\u04D9\u0442\u0442\u0435 \u0436\u0430\u0440\u044B\u049B \u0436\u0430\u043D\u0431\u0430\u0493\u0430\u04 9\u043D\u0435 \u0442\u0456\u0440\u0435\u043A\u0442\u0435\u0440\u0434\u0435\u0433\u0456 \u043A\u0430\u0431\u0435\u043B\u044C\u0434\u0456; \u043A\u043E\u043D\u0442\u0430\u043A\u0442\u043E\u0440\u0434\u0430\u043D \u043A\u0435\u0439\u0456\u043D\u0433\u0456 \u043A\u0435\u0440\u043D\u0435\u0443\u0434\u0456.","\u0412\u0432\u043E\u0434 \u043E\u0442 \u0420\u042D\u0421 \u0438 \u0432\u0432\u043E\u0434\u043D\u043E\u0439 \u0430\u0432\u0442\u043E\u043C\u0430\u0442; \u043F\u0440\u0438 \u043F\u0440\u043E\u043F\u0430\u0436\u0435 \u0444\u0430\u0437\u044B \u043D\u0430 \u0432\u0432\u043E\u0434\u0435 \u2014 \u0437\u0432\u043E\u043D\u0438\u0442\u044C \u0432 \u0420\u042D\u0421.":"\u0410\u042D\u0416 \u043A\u0456\u0440\u0456\u0441\u0456\u043D \u0436\u04D9\u043D\u0435 \u043A\u0456\u0440\u0456\u0441 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u044B\u043D; \u043A\u0456\u0440\u0456\u0441\u0442\u0435 \u0444\u0430\u0437\u0430 \u0436\u043E\u049B \u0431\u043E\u043B\u0441\u0430 \u2014 \u0410\u042D\u0416-\u0433\u0435 \u0445\u0430\u0431\u0430\u0440\u043B\u0430\u0441\u044B\u04A3\u044B\u0437.","\u041D\u0430\u0433\u0440\u0443\u0437\u043A\u0443 \u043B\u0438\u043D\u0438\u0438: \u043F\u043E\u0434\u043A\u043B\u044E\u0447\u0451\u043D\u043D\u044B\u0435 \u0441\u0442\u043E\u0440\u043E\u043D\u043D\u0438\u0435 \u043F\u043E\u0442\u0440\u0435\u0431\u0438\u0442\u0435\u043B\u0438, \u043F\u0440\u043E\u0431\u0438\u0442\u044B\u0435 \u0441\u0432\u0435\u0442\u0438\u043B\u044C\u043D\u0438\u043A\u0438, \u0441\u043E\u0441\u0442\u043E\u044F\u043D\u0438\u0435 \u043A\u0430\u0431\u0435\u043B\u044F.":"\u0416\u0435\u043B\u0456 \u0436\u04AF\u043A\u0442\u0435\u043C\u0435\u0441\u0456\u043D: \u0431\u04E9\u0433\u0434\u0435 \u0442\u04B1\u0442\u044B\u043D\u0443\u0448\u044B\u043B\u0430\u0440\u0434\u044B, \u0431\u04AF\u043B\u0456\u043D\u0433\u0435\u043D \u0448\u0430\u043C\u0434\u0430\u0440\u0434\u044B, \u043A\u0430\u0431\u0435\u043B\u044C \u043A\u04AF\u0439\u0456\u043D.","\u0424\u043E\u0442\u043E\u0440\u0435\u043B\u0435: \u0437\u0430\u0433\u0440\u044F\u0437\u043D\u0435\u043D\u0438\u0435, \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0443 \u043F\u043E\u0440\u043E\u0433\u0430, \u0438\u0441\u043F\u0440\u0430\u0432\u043D\u043E\u0441\u0442\u044C; \u043A\u043E\u043D\u0442\u0430\u043A\u0442\u043E\u0440 \u043D\u0430 \u0437\u0430\u043B\u0438\u043F\u0430\u043D\u0438\u0435.":"\u0424\u043E\u0442\u043E\u0440\u0435\u043B\u0435: \u043B\u0430\u0441\u0442\u0430\u043D\u0443\u044B\u043D, \u0448\u0435\u0433\u0456\u043D\u0456\u04A3 \u0431\u0430\u043F\u0442\u0430\u043B\u0443\u044B\u043D, \u0436\u0430\u0440\u0430\u043C\u0434\u044B\u043B\u044B\u0493\u044B\u043D; \u043A\u043E\u043D\u0442\u0430\u043A\u0442\u043E\u0440\u0434\u044B\u04A3 \u0436\u0430\u0431\u044B\u0441\u0443\u044B\u043D.","\u041A\u0442\u043E \u043E\u0442\u043A\u0440\u044B\u043B \u0448\u043A\u0430\u0444; \u0437\u0430\u043C\u043E\u043A \u0438 \u0433\u0435\u0440\u043A\u043E\u043D \u0434\u0432\u0435\u0440\u0438.":"\u0428\u043A\u0430\u0444\u0442\u044B \u043A\u0456\u043C \u0430\u0448\u049B\u0430\u043D\u044B\u043D; \u0435\u0441\u0456\u043A \u049B\u04B1\u043B\u043F\u044B \u043C\u0435\u043D \u0433\u0435\u0440\u043A\u043E\u043D\u044B\u043D.","\u041D\u0430\u043F\u0440\u044F\u0436\u0435\u043D\u0438\u0435 \u043D\u0430 \u0432\u0432\u043E\u0434\u0435 \u0448\u043A\u0430\u0444\u0430; \u0435\u0441\u043B\u0438 \u0435\u0433\u043E \u043D\u0435\u0442 \u2014 \u0437\u0432\u043E\u043D\u0438\u0442\u044C \u0432 \u0420\u042D\u0421.":"\u0428\u043A\u0430\u0444 \u043A\u0456\u0440\u0456\u0441\u0456\u043D\u0434\u0435\u0433\u0456 \u043A\u0435\u0440\u043D\u0435\u0443\u0434\u0456; \u043E\u043B \u0436\u043E\u049B \u0431\u043E\u043B\u0441\u0430 \u2014 \u0410\u042D\u0416-\u0433\u0435 \u0445\u0430\u0431\u0430\u0440\u043B\u0430\u0441\u044B\u04A3\u044B\u0437.","\u041F\u0438\u0442\u0430\u043D\u0438\u0435 \u0441\u0447\u0451\u0442\u0447\u0438\u043A\u0430 \u0438 \u043F\u0440\u043E\u0432\u043E\u0434\u0430 RS-485 (A \u0438 B) \u0434\u043E \u043A\u043E\u043D\u0442\u0440\u043E\u043B\u043B\u0435\u0440\u0430.":"\u0415\u0441\u0435\u043F\u0442\u0435\u0433\u0456\u0448 \u049B\u0443\u0430\u0442\u044B\u043D \u0436\u04D9\u043D\u0435 \u043A\u043E\u043D\u0442\u0440\u043E\u043B\u043B\u0435\u0440\u0433\u0435 \u0434\u0435\u0439\u0456\u043D\u0433\u0456 RS-485 (A \u0436\u04D9\u043D\u0435 B) \u0441\u044B\u043C\u0434\u0430\u0440\u044B\u043D.","\u041A\u043E\u043D\u0442\u0430\u043A\u0442\u043E\u0440 KM1: \u043A\u0430\u0442\u0443\u0448\u043A\u0443, \u0433\u043B\u0430\u0432\u043D\u044B\u0435 \u043A\u043E\u043D\u0442\u0430\u043A\u0442\u044B \u0438 \u0434\u043E\u043F. \u043A\u043E\u043D\u0442\u0430\u043A\u0442; \u0440\u0435\u043B\u0435 K2 \u0438 \u043F\u0435\u0440\u0435\u043A\u043B\u044E\u0447\u0430\u0442\u0435\u043B\u044C SA1.":"KM1 \u043A\u043E\u043D\u0442\u0430\u043A\u0442\u043E\u0440\u044B: \u043A\u0430\u0442\u0443\u0448\u043A\u0430\u0441\u044B\u043D, \u043D\u0435\u0433\u0456\u0437\u0433\u0456 \u0436\u04D9\u043D\u0435 \u049B\u043E\u0441\u044B\u043C\u0448\u0430 \u0442\u04AF\u0439\u0456\u0441\u043F\u0435\u043B\u0435\u0440\u0456\u043D; K2 \u0440\u0435\u043B\u0435\u0441\u0456 \u043C\u0435\u043D SA1 \u0430\u0443\u044B\u0441\u0442\u044B\u0440\u044B\u043F-\u049B\u043E\u0441\u049B\u044B\u0448\u044B\u043D.","\u0412\u0435\u043D\u0442\u0438\u043B\u044F\u0446\u0438\u044E \u0438 \u043E\u0431\u043E\u0433\u0440\u0435\u0432 \u0448\u043A\u0430\u0444\u0430, \u043D\u0430\u0433\u0440\u0435\u0432 \u043A\u043B\u0435\u043C\u043C \u0438 \u043A\u043E\u043D\u0442\u0430\u043A\u0442\u043E\u0440\u0430.":"\u0428\u043A\u0430\u0444\u0442\u044B\u04A3 \u0436\u0435\u043B\u0434\u0435\u0442\u0443\u0456 \u043C\u0435\u043D \u0436\u044B\u043B\u044B\u0442\u0443\u044B\u043D, \u043A\u043B\u0435\u043C\u043C\u0430\u043B\u0430\u0440 \u043C\u0435\u043D \u043A\u043E\u043D\u0442\u0430\u043A\u0442\u043E\u0440\u0434\u044B\u04A3 \u049B\u044B\u0437\u0443\u044B\u043D.","\u0412\u0441\u0435 \u043B\u0438\u043D\u0438\u0438 \u043D\u0430 \u0437\u0430\u043C\u044B\u043A\u0430\u043D\u0438\u0435 (\u043C\u0435\u0433\u0430\u043E\u043C\u043C\u0435\u0442\u0440\u043E\u043C), \u0437\u0430\u0442\u0435\u043C \u0432\u043A\u043B\u044E\u0447\u0438\u0442\u044C QF1. \u041D\u0435 \u0432\u043A\u043B\u044E\u0447\u0430\u0442\u044C \u043F\u043E\u0432\u0442\u043E\u0440\u043D\u043E \u0431\u0435\u0437 \u043F\u0440\u043E\u0432\u0435\u0440\u043A\u0438.":"\u0411\u0430\u0440\u043B\u044B\u049B \u0436\u0435\u043B\u0456\u043D\u0456 \u0442\u04B1\u0439\u044B\u049B\u0442\u0430\u043B\u0443\u0493\u0430 (\u043C\u0435\u0433\u0430\u043E\u043C\u043C\u0435\u0442\u0440\u043C\u0435\u043D) \u0442\u0435\u043A\u0441\u0435\u0440\u0456\u043F, \u0441\u043E\u0434\u0430\u043D \u043A\u0435\u0439\u0456\u043D QF1 \u049B\u043E\u0441\u0443. \u0422\u0435\u043A\u0441\u0435\u0440\u043C\u0435\u0439 \u049B\u0430\u0439\u0442\u0430 \u049B\u043E\u0441\u043F\u0430\u04A3\u044B\u0437.","\u041A\u0442\u043E \u0438 \u043F\u043E\u0447\u0435\u043C\u0443 \u0432\u044B\u043A\u043B\u044E\u0447\u0438\u043B \u0432\u0432\u043E\u0434\u043D\u043E\u0439 \u0430\u0432\u0442\u043E\u043C\u0430\u0442; \u043F\u043E\u0441\u043B\u0435 \u0440\u0430\u0431\u043E\u0442 \u0432\u043A\u043B\u044E\u0447\u0438\u0442\u044C QF1.":"\u041A\u0456\u0440\u0456\u0441 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u044B\u043D \u043A\u0456\u043C \u0436\u04D9\u043D\u0435 \u043D\u0435\u0433\u0435 \u04E9\u0448\u0456\u0440\u0433\u0435\u043D\u0456\u043D; \u0436\u04B1\u043C\u044B\u0441\u0442\u0430\u043D \u043A\u0435\u0439\u0456\u043D QF1 \u049B\u043E\u0441\u0443.","\u041B\u0438\u043D\u0438\u044E \u043D\u0430 \u0437\u0430\u043C\u044B\u043A\u0430\u043D\u0438\u0435 \u0438 \u043F\u0440\u043E\u0431\u043E\u0439 \u0438\u0437\u043E\u043B\u044F\u0446\u0438\u0438, \u0441\u0432\u0435\u0442\u0438\u043B\u044C\u043D\u0438\u043A\u0438 \u043D\u0430 \u043E\u043F\u043E\u0440\u0430\u0445; \u0437\u0430\u0442\u0435\u043C \u0432\u043A\u043B\u044E\u0447\u0438\u0442\u044C \u0430\u0432\u0442\u043E\u043C\u0430\u0442 \u043B\u0438\u043D\u0438\u0438.":"\u0416\u0435\u043B\u0456\u043D\u0456 \u0442\u04B1\u0439\u044B\u049B\u0442\u0430\u043B\u0443 \u043C\u0435
