# Sortirovka24 on a Kazakhstan VPS (Hoster.kz). One host: Caddy -> app -> PostgreSQL.
# Secrets live only in /opt/s24/.env on the server (never in git).
name: s24

services:
  db:
    image: postgres:18.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-railway}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-railway}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    image: s24-app:${APP_TAG:-current}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-railway}
      PORT: "8000"
      ENVIRONMENT: production
      WHISPER_URL: http://whisper:9000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=5)\""]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 60s
    networks: [internal, web]

  # WhatsApp gateway (WAHA, GOWS engine, no browser) for the portal's own number: login codes and the bot.
  # Not published to the internet: only the app talks to it, with WAHA_API_KEY from .env.
  waha:
    image: devlikeapro/waha@sha256:1ae3c6a994ee97e5039bf41103193d7bf9175f1a31db73ba89bdeed6277901bc
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WHATSAPP_START_SESSION: default
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WAHA_DASHBOARD_ENABLED: "False"
      WHATSAPP_SWAGGER_ENABLED: "False"
      WAHA_PRINT_QR: "False"
      # Incoming messages go to the support bot inside the app (same network, key = WAHA_API_KEY).
      WHATSAPP_HOOK_URL: http://app:8000/api/v1/support-bot/waha?key=${WAHA_API_KEY:-}
      WHATSAPP_HOOK_EVENTS: message.any
      WHATSAPP_DOWNLOAD_MEDIA: "True"
      WAHA_EVENTS_DOWNLOAD_MEDIA: "True"
      TZ: Asia/Almaty
    volumes:
      - waha-sessions:/app/.sessions
    mem_limit: 768m
    networks: [web]

  # Speech-to-text for voice notes to the support bot (Whisper on CPU, not exposed).
  whisper:
    image: onerahmet/openai-whisper-asr-webservice@sha256:0616c3d5fc6924e9d59aa8a7a3a944fbe8f3a5d701e5fc1fa2ce5b933dfecb73
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: small
      ASR_MODEL_PATH: /data/models
    volumes:
      - whisper-models:/data/models
    mem_limit: 1500m
    networks: [web]

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
    networks: [web]

volumes:
  waha-sessions:
  whisper-models:
  db-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    internal: true
  web:
