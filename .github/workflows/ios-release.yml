name: iOS build (simulator or signed App Store IPA)

on:
  workflow_dispatch:
    inputs:
      signed:
        description: 'Export signed IPA (requires Apple Developer signing secrets)'
        type: boolean
        default: false
      build_number:
        description: 'Unused positive build number'
        required: true
        default: '27'

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: app/frontend
    env:
      API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://sortirovka24-production-8788.up.railway.app' }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml
      - name: Validate build tools and input
        run: |
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]] || { echo 'Invalid build number'; exit 1; }
          xcodebuild -version
          MAJOR=$(xcodebuild -version | awk '/Xcode/{split($2,v,".");print v[1]}')
          [[ "$MAJOR" -ge 26 ]] || exit 1
      - name: Install and build bundled assets
        run: |
          pnpm install --frozen-lockfile
          node scripts/build-store-web.mjs ios
      - name: Build simulator app without Apple signing
        if: ${{ !inputs.signed }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" build
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/ios-build/Build/Products/Release-iphonesimulator/App.app" \
            "$RUNNER_TEMP/Sortirovka24-simulator.zip"
      - name: Import distribution identity
        if: ${{ inputs.signed }}
        env:
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CERTIFICATE" && test -n "$PROFILE" && test -n "$APPLE_TEAM_ID" || { echo 'Apple signing secrets are missing'; exit 1; }
          umask 077
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db" login.keychain-db
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          [[ "$PROFILE_TEAM" == "$APPLE_TEAM_ID" && "$APP_ID" == "$APPLE_TEAM_ID.kz.sortirovka24.app" ]] || { echo 'Signing profile does not match app/team'; exit 1; }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
      - name: Archive and export signed IPA
        if: ${{ inputs.signed }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" archive
          python3 - <<'PY'
          import os, plistlib
          settings = dict(method='app-store-connect', destination='export', signingStyle='manual',
              teamID=os.environ['APPLE_TEAM_ID'], signingCertificate='Apple Distribution',
              provisioningProfiles={'kz.sortirovka24.app': os.environ['PROFILE_UUID']},
              manageAppVersionAndBuildNumber=False, uploadSymbols=True)
          with open(os.environ['RUNNER_TEMP']+'/ExportOptions.plist','wb') as out:
              plistlib.dump(settings,out)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
      - uses: actions/upload-artifact@v4
        with:
          name: Sortirovka24-ios-${{ inputs.build_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/Sortirovka24-simulator.zip
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing identity
        if: ${{ always() && inputs.signed }}
        run: |
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi
          # The ephemeral runner is destroyed after this job.
