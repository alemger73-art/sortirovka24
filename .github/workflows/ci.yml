name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  deploy-safety:
    name: Deploy safety and migration graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Alembic graph without touching a database
        run: python scripts/check-migration-graph.py
      - name: Validate staging guard tests
        working-directory: app/backend
        run: python -m unittest discover -s tests -p 'test_deploy_safety.py'

  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        env:
          INTEGRITY_BASE_URL: http://127.0.0.1:8000
        run: pytest -v --ignore=tests/test_integrity.py

  frontend:
    name: Frontend lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc -p tsconfig.app.json --noEmit
      - run: pnpm run check:i18n
      - run: pnpm build

  checkout-mobile:
    name: E2E (Playwright, mobile checkout matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      EXTERNAL_SIDE_EFFECTS: disabled
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      INTEGRITY_BASE_URL: ""
      VITE_API_BASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml
      - name: Install backend deps
        working-directory: app/backend
        run: pip install -r requirements.txt
      - name: Install frontend deps
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile
      - name: Install dedicated Chromium
        working-directory: app/frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run all mobile viewport and theme projects with isolated API
        working-directory: app/frontend
        run: |
          pnpm exec vite build --config vite.food-test.config.ts
          pnpm exec playwright test --config playwright.checkout-mobile.config.ts

  e2e:
    name: E2E (Playwright, ${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [ui, auth, crm, payment, menu, cart, checkout, client, receipt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - name: Install backend deps
        working-directory: app/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend (DEBUG, SMS code exposed)
        if: matrix.suite == 'ui' || matrix.suite == 'auth'
        working-directory: app/backend
        env:
          DEBUG: "1"
          ENVIRONMENT: dev
          SMS_EXPOSE_CODE: "1"
          EXTERNAL_SIDE_EFFECTS: disabled
          DATABASE_URL: ""
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done

      - name: Install frontend deps
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chrome (matches the `chrome` channel used by config)
        working-directory: app/frontend
        run: pnpm exec playwright install --with-deps chrome

      - name: Run E2E
        working-directory: app/frontend
        env:
          E2E_SUITE: ${{ matrix.suite }}
        run: |
          pnpm exec vite build --config vite.food-test.config.ts
          pnpm exec playwright test --config playwright.ci.config.ts
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.suite }}-diagnostics
          path: |
            app/frontend/test-results
            app/backend/backend.log
