name: Build Mobile Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/frontend/**'
      - '.github/workflows/build-mobile.yml'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install & build web
        run: |
          pnpm install --frozen-lockfile
          cp -n .env.mobile.example .env.mobile || true
          pnpm run build:mobile
          pnpm exec cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sortirovka24-android-debug
          path: app/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  ios:
    name: iOS (simulator build)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - name: Install & build web
        run: |
          pnpm install --frozen-lockfile
          cp -n .env.mobile.example .env.mobile || true
          pnpm run build:mobile
          pnpm exec cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build for iOS Simulator
        run: |
          cd ios/App
          # Prefer a concrete iPhone sim when present; fall back to generic destination.
          DEST=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{gsub(/ /,"",$2); print "platform=iOS Simulator,id="$2; exit}')
          if [ -z "$DEST" ]; then
            DEST='generic/platform=iOS Simulator'
          fi
          echo "Using destination: $DEST"
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination "$DEST" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-output
          path: app/frontend/ios/App/build/
          retention-days: 7
