<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Sortirovka24 Админ</title>
    <meta name="description" content="Панель управления проектом Sortirovka24" />
    <meta name="theme-color" content="#0B0F19" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="S24 Админ" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('sortirovka-theme');
          if (theme !== 'dark' && theme !== 'light') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var lang = localStorage.getItem('app_lang');
          if (lang !== 'ru' && lang !== 'kz') lang = /^(kk|kz)/i.test(navigator.language) ? 'kz' : 'ru';
          document.documentElement.lang = lang === 'kz' ? 'kk' : 'ru';
          document.documentElement.style.colorScheme = theme;
          if (lang === 'kz') document.title = 'Sortirovka24 · Басқару';
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#0B0F19;color:#fff;font-family:system-ui,sans-serif">
      <div style="text-align:center">
        <img src="/icon-192.png" width="72" height="72" alt="" style="border-radius:16px;margin-bottom:12px" />
        <p id="admin-boot-title" style="margin:0;font-size:15px;font-weight:600">Sortirovka24 Админ</p>
        <p id="admin-boot-label" style="margin:8px 0 0;font-size:13px;opacity:.6">Загрузка…</p>
        <script>if(document.documentElement.lang === "kk") { document.getElementById("admin-boot-label").textContent = "Жүктелуде…"; document.getElementById("admin-boot-title").textContent = "Sortirovka24 · Басқару"; }</script>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/admin-shell/main.tsx"></script>
  </body>
</html>
