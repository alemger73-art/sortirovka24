<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="%VITE_APP_LOGO_URL%" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>%VITE_APP_TITLE%</title>
    <meta name="description" content="%VITE_APP_DESCRIPTION%" />
    <meta name="author" content="Sortirovka24" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sortirovka24" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="dns-prefetch" href="https://mgx-backend-cdn.metadl.com" />
    <link rel="preconnect" href="https://mgx-backend-cdn.metadl.com" crossorigin />

    <meta property="og:title" content="%VITE_APP_TITLE%" />
    <meta property="og:description" content="%VITE_APP_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('sortirovka-theme');
          var currentUserId = localStorage.getItem('s24_current_user_id');
          if (currentUserId) {
            var usersRaw = localStorage.getItem('s24_users');
            var users = usersRaw ? JSON.parse(usersRaw) : [];
            if (Array.isArray(users)) {
              var current = users.find(function (u) { return u && u.id === currentUserId; });
              if (current && (current.themePreference === 'dark' || current.themePreference === 'light')) {
                theme = current.themePreference;
              }
            }
          }
          if (theme !== 'dark' && theme !== 'light') {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(theme);
        } catch (e) {
          // Ignore early theme bootstrap errors
        }
      })();
    </script>
  </head>

  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-splash-inner">
        <img src="/icon-192.png" width="88" height="88" alt="" decoding="async" />
        <p class="boot-splash-title">Сортировка 24</p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Failsafe: never leave the static splash on screen if JS bundle hangs.
      setTimeout(function () {
        var splash = document.getElementById('boot-splash');
        if (splash) splash.remove();
      }, 12000);
    </script>
    <script>
      // Hide MetaGPT SDK error overlay for transient network failures only.
      (function() {
        var TRANSIENT = /503|502|504|temporarily.unavailable|service.unavailable|econnrefused|enotfound|econnreset|failed.to.fetch|load.failed|network.error|loading.chunk|dynamically.imported/i;

        var style = document.createElement('style');
        style.textContent = '#custom-vite-error-overlay { display: none !important; }';
        document.head.appendChild(style);

        var observer = new MutationObserver(function(mutations) {
          for (var i = 0; i < mutations.length; i++) {
            var added = mutations[i].addedNodes;
            for (var j = 0; j < added.length; j++) {
              var node = added[j];
              if (node.nodeType === 1 && node.id === 'custom-vite-error-overlay') {
                node.remove();
              }
            }
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });

        window.addEventListener('error', function(e) {
          var m = String(e.message || '');
          if (TRANSIENT.test(m)) {
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var m = String(e.reason && e.reason.message || e.reason || '');
          if (TRANSIENT.test(m)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
