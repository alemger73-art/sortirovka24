<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sortirovka24 Админ</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: #0B0F19; color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 24px; gap: 18px;
    }
    .logo {
      width: 72px; height: 72px; border-radius: 18px;
      background: #1e293b; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.4);
    }
    .logo svg { width: 38px; height: 38px; }
    h1 { font-size: 18px; margin: 0; font-weight: 700; }
    p { font-size: 14px; margin: 0; color: #94a3b8; max-width: 320px; line-height: 1.5; }
    .spinner {
      width: 26px; height: 26px; border: 3px solid #334155;
      border-top-color: #60a5fa; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    button {
      margin-top: 6px; padding: 12px 22px; border: none; border-radius: 12px;
      background: #2563eb; color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer;
    }
    button:active { background: #1d4ed8; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5l-8-3z" fill="#60a5fa"/>
        <path d="M9.5 12.5l2 2 3.5-4" stroke="#0B0F19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div id="loading">
      <div class="spinner" style="margin: 0 auto 14px;"></div>
      <h1>Загрузка панели управления…</h1>
      <p>Подключаемся к серверу Sortirovka24.</p>
    </div>
    <div id="offline" class="hidden">
      <h1>Нет подключения к серверу</h1>
      <p>Проверьте интернет-соединение и попробуйте снова. Приложению нужен доступ к серверу, чтобы открыть админ-панель.</p>
      <button onclick="retry()">Повторить</button>
    </div>
  </div>

  <script>
    // В live-режиме Capacitor сам открывает админку с сервера.
    // Этот экран показывается только когда сервер недоступен (офлайн).
    var ADMIN_URL = 'https://sortirovka24-production-8788.up.railway.app/admin';

    function showOffline() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('offline').classList.remove('hidden');
    }

    function retry() {
      document.getElementById('offline').classList.add('hidden');
      document.getElementById('loading').classList.remove('hidden');
      location.href = ADMIN_URL;
    }

    // Если за 8 секунд сервер не открылся — показываем офлайн-экран.
    setTimeout(showOffline, 8000);
  </script>
</body>
</html>
